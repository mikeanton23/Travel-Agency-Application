# Fly.io alternative: also gives a free https://<app>.fly.dev URL.
#
#   fly launch --no-deploy          (creates the app, keeps this file)
#   fly postgres create             (then: fly postgres attach <name>)
#   fly secrets set APP_ENV=production \
#       APP_BASE_URL=https://<app>.fly.dev \
#       APP_SECRET_KEY=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))") \
#       LITEAPI_KEY=... GEOAPIFY_API_KEY=... PEXELS_API_KEY=...
#   fly deploy
#   fly ssh console -C "alembic upgrade head"

app = "aevyra"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8086"
  APP_ENV = "production"

[http_service]
  internal_port = 8086
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/robots.txt"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
